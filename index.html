<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; media-src https: http: blob:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#06070b">
<title>Lecteur</title>
<style>
:root{--ink:#f5f7fc;--dim:rgba(245,247,252,.64);--acc:#8ecbff;--spring:cubic-bezier(.34,1.56,.64,1);--out:cubic-bezier(.22,1,.36,1)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-user-drag:none}
::selection{background:transparent}
body{cursor:default}
html,body{height:100%}
body{background:#06070b;color:var(--ink);font:500 15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;display:grid;place-items:center;overflow:hidden;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;overscroll-behavior:none}
.aura{position:fixed;inset:-25%;z-index:0;filter:blur(100px) saturate(1.5);opacity:.5;pointer-events:none;transition:opacity .8s}
.aura i{position:absolute;width:48vmax;height:48vmax;border-radius:50%;will-change:transform;animation:drift 24s ease-in-out infinite alternate}
.aura i:nth-child(1){background:#2a5bff;left:0;top:0}.aura i:nth-child(2){background:#a23cff;right:0;top:25%;animation-delay:-8s}.aura i:nth-child(3){background:#00c2c7;left:30%;bottom:0;animation-delay:-15s}
@keyframes drift{to{transform:translate3d(14vmax,-9vmax,0) scale(1.3)}}
.stage{position:relative;z-index:1;width:min(96vw,calc(86vh*16/9),1500px);width:min(96vw,calc(86dvh*16/9),1500px);aspect-ratio:16/9;perspective:1600px}
.stage.fsm{width:100vw;height:100vh;height:100dvh;aspect-ratio:auto;perspective:none}
#amb{position:absolute;inset:-7%;width:114%;height:114%;filter:blur(46px) saturate(1.7);opacity:.75;transform:translateZ(0);transition:opacity .8s;pointer-events:none}
.off #amb{opacity:0}
.pl{position:absolute;inset:0;background:#000;border-radius:clamp(16px,2.6vw,32px);overflow:hidden;transform-style:preserve-3d;will-change:transform;box-shadow:0 0 0 1px rgba(255,255,255,.14),0 50px 120px -30px rgba(0,0,0,.9);transition:transform .7s var(--out),border-radius .4s var(--out)}
.pl.tilt{transition:transform .12s linear}
.stage.fsm .pl{border-radius:0;transform:none!important}
video{width:100%;height:100%;display:block;object-fit:contain;background:#000}
.glass{position:relative;background:linear-gradient(145deg,rgba(255,255,255,.2),rgba(255,255,255,.05) 38%,rgba(255,255,255,.03) 62%,rgba(255,255,255,.12));-webkit-backdrop-filter:blur(24px) saturate(2.1) brightness(1.1) contrast(1.05);backdrop-filter:blur(24px) saturate(2.1) brightness(1.1) contrast(1.05);box-shadow:inset 0 0 0 1px rgba(255,255,255,.15),inset 0 1.5px 1px rgba(255,255,255,.55),inset 0 -1.5px 1px rgba(255,255,255,.12),inset 0 -14px 24px -12px rgba(120,170,255,.16),inset 0 0 30px rgba(255,255,255,.05),0 22px 46px -10px rgba(0,0,0,.6),0 4px 12px rgba(0,0,0,.25)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(220px circle at var(--mx,50%) var(--my,-30%),rgba(255,255,255,.34),transparent 62%);opacity:.9;transition:opacity .4s}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;padding:1px;background:linear-gradient(160deg,rgba(255,255,255,.7),rgba(255,255,255,0) 30%,rgba(255,255,255,0) 70%,rgba(160,200,255,.5));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.glass>*{position:relative;z-index:1}
.top,.bar{position:absolute;left:clamp(8px,2vw,24px);right:clamp(8px,2vw,24px);transition:opacity .5s var(--out),transform .7s var(--out);transform:translateZ(40px)}
.top{top:clamp(8px,2vw,24px);display:flex;align-items:center;padding:10px 20px;border-radius:999px;width:fit-content;max-width:calc(100% - 2*clamp(8px,2vw,24px))}
.top h1{font-size:14px;font-weight:620;letter-spacing:.1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{bottom:clamp(8px,2vw,24px);padding:10px clamp(10px,2vw,20px) 8px;border-radius:30px}
.hide .top{opacity:0;transform:translate3d(0,-16px,0) scale(.97);pointer-events:none}
.hide .bar{opacity:0;transform:translate3d(0,22px,0) scale(.97);pointer-events:none}
.hide{cursor:none}
.row{display:flex;align-items:center;gap:clamp(0px,.8vw,8px)}.sp{flex:1}
button{all:unset;box-sizing:border-box;cursor:pointer;display:grid;place-items:center;min-width:42px;height:42px;padding:0 10px;border-radius:999px;font-size:13px;font-weight:620;transition:transform .45s var(--spring),background .3s;position:relative}
button:hover{background:rgba(255,255,255,.15);box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
button:active{transform:scale(.84);background:rgba(255,255,255,.26)}
button:focus-visible,.seek:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button svg{width:22px;height:22px;fill:currentColor;filter:drop-shadow(0 1px 2px rgba(0,0,0,.35))}
#play{min-width:52px;height:52px;background:rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 0 0 1px rgba(255,255,255,.12)}#play svg{width:27px;height:27px}
.seek{position:relative;height:24px;display:flex;align-items:center;cursor:pointer;touch-action:none;margin:0 2px 2px}
.track{position:relative;width:100%;height:6px;border-radius:9px;background:rgba(255,255,255,.2);box-shadow:inset 0 1px 2px rgba(0,0,0,.4);transition:height .35s var(--spring)}
.seek:hover .track,.seek.drag .track{height:10px}
.buf,.fill{position:absolute;left:0;top:0;bottom:0;border-radius:9px;transform-origin:left;transform:scaleX(0)}
.buf{background:rgba(255,255,255,.28)}
.clip{position:absolute;inset:0;border-radius:9px;overflow:hidden}
.fill{background:rgba(255,255,255,.5)}
.comet{position:absolute;top:0;bottom:0;left:0;width:90px;background:linear-gradient(90deg,rgba(255,255,255,0) 0,rgba(255,255,255,.1) 30%,rgba(255,255,255,.42) 62%,rgba(255,255,255,.8) 88%,#fff 100%);will-change:transform}
.glow{position:absolute;left:0;top:50%;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.55),rgba(255,255,255,.14) 42%,rgba(255,255,255,0) 70%);pointer-events:none;will-change:transform;opacity:.65;transition:opacity .4s}
.seek.drag .glow{opacity:1}
.knob{position:absolute;top:50%;left:0;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#dfe8ff 70%);box-shadow:0 3px 12px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.6),0 0 16px 3px rgba(255,255,255,.75);transform:scale(.62);transition:transform .45s var(--spring)}
.seek:hover .knob,.seek.drag .knob{transform:scale(1)}.seek.drag .knob{transform:scale(1.35)}
.tip{position:absolute;bottom:30px;left:0;padding:4px 11px;border-radius:999px;font-size:12px;font-variant-numeric:tabular-nums;opacity:0;transform:translateX(-50%) translateY(8px) scale(.9);transition:opacity .2s,transform .4s var(--spring);pointer-events:none}
.seek:hover .tip,.seek.drag .tip{opacity:1;transform:translateX(-50%)}
.time{font-variant-numeric:tabular-nums;font-size:13px;color:var(--dim);padding:0 8px;white-space:nowrap}
.vol{display:flex;align-items:center}
.menu{position:absolute;right:clamp(8px,2vw,24px);bottom:calc(clamp(8px,2vw,24px) + var(--bh,100px) + 10px);width:min(clamp(270px,28vw,360px),calc(100% - 24px));max-height:calc(100% - var(--bh,100px) - 56px);overflow:auto;overscroll-behavior:contain;scrollbar-width:none;padding:16px;border-radius:26px;transform-origin:bottom right;transform:translateZ(60px) scale(.7) translateY(14px);opacity:0;pointer-events:none;transition:transform .6s var(--spring),opacity .25s;z-index:4}
.menu.on{transform:translateZ(60px);opacity:1;pointer-events:auto}
.menu h3{font-size:12px;font-weight:600;color:var(--dim);margin:0 4px 8px}
.chips{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-bottom:12px;padding:4px;border-radius:16px;background:rgba(0,0,0,.28);box-shadow:inset 0 1px 3px rgba(0,0,0,.4)}
.chips button{min-width:0;height:34px;padding:0;border-radius:12px;font-size:12px}
.chips button.sel{background:rgba(255,255,255,.9);color:#0a0c12;box-shadow:0 2px 10px rgba(0,0,0,.4)}
.opt{display:flex;align-items:center;justify-content:space-between;width:100%;height:44px;padding:0 6px 0 12px;border-radius:14px;justify-content:space-between}
.sw{width:46px;height:28px;border-radius:99px;background:rgba(255,255,255,.2);box-shadow:inset 0 1px 3px rgba(0,0,0,.5);position:relative;transition:background .35s}
.sw i{position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.5);transition:transform .5s var(--spring)}
.opt[aria-checked=true] .sw{background:#4cd08a}.opt[aria-checked=true] .sw i{transform:translateX(18px)}
.menu .opt,.menu .chips{opacity:0;transform:translateY(12px) scale(.96);transition:transform .65s var(--spring),opacity .3s,background .3s}
.menu.on .opt,.menu.on .chips{opacity:1;transform:none;transition-delay:calc(var(--i,0)*50ms + 100ms)}
.menu.on .opt:hover,.menu.on .opt:active{transition-delay:0s}
.menu.on .opt:active{transform:scale(.96)}
.vs{position:relative;width:0;height:32px;margin:0;opacity:0;display:flex;align-items:center;cursor:pointer;touch-action:none;transition:width .6s var(--out),opacity .3s,margin .6s var(--out)}
.vol:hover .vs,.vol:focus-within .vs,.vs.drag{width:100px;opacity:1;margin:0 12px 0 2px}
.vs:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:9px}
.vt{position:relative;width:100%;height:6px;border-radius:9px;background:rgba(255,255,255,.2);box-shadow:inset 0 1px 2px rgba(0,0,0,.4);transition:height .35s var(--spring)}
.vs:hover .vt,.vs.drag .vt{height:9px}
.vf{position:absolute;inset:0;border-radius:9px;transform-origin:left;transform:scaleX(1);background:linear-gradient(90deg,rgba(255,255,255,.45),#fff);box-shadow:0 0 12px rgba(255,255,255,.55)}
.vk{position:absolute;top:50%;left:100%;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#dfe8ff 70%);box-shadow:0 3px 10px rgba(0,0,0,.5),0 0 14px 2px rgba(255,255,255,.6);transform:scale(.7);transition:transform .45s var(--spring)}
.vs:hover .vk{transform:scale(1)}.vs.drag .vk{transform:scale(1.3)}
.vp{position:absolute;left:100%;bottom:30px;padding:3px 9px;border-radius:99px;font-size:11px;font-variant-numeric:tabular-nums;background:rgba(20,22,32,.72);box-shadow:inset 0 0 0 1px rgba(255,255,255,.2);opacity:0;transform:translateX(-50%) translateY(6px) scale(.9);transition:opacity .2s,transform .4s var(--spring);pointer-events:none}
.vs.drag .vp{opacity:1;transform:translateX(-50%)}
.sig{position:fixed;left:0;right:0;bottom:max(env(safe-area-inset-bottom),10px);z-index:1;display:flex;justify-content:center;align-items:baseline;gap:8px;pointer-events:none;color:rgba(255,255,255,.6)}
.pw{font-size:11px;letter-spacing:.5px;animation:pw 7s ease-in-out infinite}
.sh{padding:0 8px 2px;font:italic 400 26px/1.15 "Snell Roundhand","Apple Chancery","Segoe Script","Bradley Hand","Brush Script MT","Lucida Handwriting",cursive;background:linear-gradient(100deg,#fff 20%,#9fd0ff 50%,#fff 80%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 8px rgba(150,200,255,.5));-webkit-mask-image:linear-gradient(90deg,#000 40%,transparent 60%);mask-image:linear-gradient(90deg,#000 40%,transparent 60%);-webkit-mask-size:260% 100%;mask-size:260% 100%;animation:wr 7s cubic-bezier(.45,.05,.25,1) infinite,shine 4s linear infinite}
@keyframes wr{0%{-webkit-mask-position:100% 0;mask-position:100% 0;opacity:1}55%{-webkit-mask-position:0 0;mask-position:0 0;opacity:1}86%{-webkit-mask-position:0 0;mask-position:0 0;opacity:1}96%{-webkit-mask-position:0 0;mask-position:0 0;opacity:0}100%{-webkit-mask-position:100% 0;mask-position:100% 0;opacity:0}}
@keyframes shine{to{background-position:-220% 0}}
@keyframes pw{0%{opacity:0;transform:translateY(4px)}14%,86%{opacity:.75;transform:none}96%,100%{opacity:0;transform:none}}
@media (max-height:480px){.sh{font-size:19px}.pw{display:none}}
.start{position:absolute;left:50%;top:50%;width:clamp(78px,24vw,108px);height:clamp(78px,24vw,108px);margin:calc(clamp(78px,24vw,108px)/-2) 0 0 calc(clamp(78px,24vw,108px)/-2);min-width:0;padding:0;border-radius:50%;display:none;z-index:7}
.start svg{width:42%;height:42%;margin-left:5%}
.intro .start{display:grid;animation:breathe 2.8s ease-in-out infinite}
.start:active{animation:none;transform:scale(.88)}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.intro .top,.intro .bar{opacity:0;pointer-events:none;transform:translate3d(0,14px,0) scale(.97)}
.intro .menu{display:none}
.stage.pseudo{position:fixed;inset:0;z-index:50;background:#000}
.pop{position:absolute;inset:0;z-index:6;display:grid;place-items:center;background:rgba(0,0,0,.38);opacity:0;pointer-events:none;transition:opacity .4s;transform:translateZ(80px)}
.pop.on{opacity:1;pointer-events:auto}
.card{width:min(88%,400px);padding:26px;border-radius:30px;transform:scale(.85) translateY(24px) rotateX(10deg);opacity:0;transition:transform .7s var(--spring),opacity .3s}
.pop.on .card{transform:none;opacity:1}
.card h2{font-size:19px;font-weight:650;margin-bottom:6px}.card p{color:var(--dim);font-size:14px;margin-bottom:18px}
.btns{display:flex;gap:10px}
.btns button{flex:1;height:46px;background:rgba(255,255,255,.1);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 0 0 1px rgba(255,255,255,.1);white-space:nowrap}
.btns .main{background:#fff;color:#0a0b10}.btns .main:hover{background:#e9eef9}
.fb{position:absolute;top:50%;width:min(24%,160px);aspect-ratio:1;margin-top:calc(min(24%,160px)/-2);border-radius:50%;display:grid;place-items:center;font-weight:650;pointer-events:none;opacity:0}
.fb.l{left:6%}.fb.r{right:6%}.fb.go{animation:fb .65s var(--out)}
@keyframes fb{0%{opacity:0;transform:scale(.6)}30%{opacity:1}100%{opacity:0;transform:scale(1.25)}}
.pulse{position:absolute;left:50%;top:50%;width:96px;height:96px;margin:-48px 0 0 -48px;border-radius:50%;display:grid;place-items:center;pointer-events:none;opacity:0}
.pulse svg{width:40px;height:40px;fill:#fff}.pulse.go{animation:pu .6s var(--out)}
@keyframes pu{0%{opacity:0;transform:scale(.55)}25%{opacity:1}100%{opacity:0;transform:scale(1.45)}}
.spin{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px;border-radius:50%;border:3px solid rgba(255,255,255,.2);border-top-color:#fff;animation:rot .8s linear infinite;opacity:0;transition:opacity .3s;pointer-events:none}
.wait .spin{opacity:1}@keyframes rot{to{transform:rotate(360deg)}}
@media (max-width:560px){.vol,#pip,.tot{display:none}.top{padding:8px 16px}.top h1{font-size:13px}.bar{padding:8px 10px 6px;border-radius:24px}button{min-width:44px;height:44px}#play{min-width:50px;height:50px}.time{padding:0 4px;font-size:12px}.menu{padding:12px;border-radius:22px}.chips button{height:38px}.opt{height:46px}}
@media (pointer:coarse){.seek{height:36px}.track{height:8px}.knob{transform:scale(.85)}.tip{bottom:42px}.seek.drag .track{height:12px}}
@media (max-height:480px){.bar{padding:6px 14px 4px;border-radius:22px}button{height:38px;min-width:38px}#play{height:42px;min-width:42px}.top{padding:6px 14px}.menu{width:min(440px,calc(100% - 24px));display:grid;grid-template-columns:1fr 1fr;gap:2px 10px;padding:10px 14px}.menu h3,.menu .chips{grid-column:1/-1}.menu .chips{margin-bottom:6px}.opt{height:38px}.chips button{height:30px}.seek{height:20px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<div class="aura" id="aura" aria-hidden="true"><i></i><i></i><i></i></div>

<div class="stage" id="stage">
  <canvas id="amb" width="48" height="27" aria-hidden="true"></canvas>
  <main class="pl" id="pl">
    <video id="v" playsinline preload="metadata" referrerpolicy="no-referrer"></video>
    <div class="spin"></div>
    <div class="fb l glass" id="fbl"></div><div class="fb r glass" id="fbr"></div>
    <div class="pulse glass" id="pulse"></div>

    <button class="start glass" id="start" aria-label="Lancer la vidéo en plein écran"></button>
    <div class="top glass" id="top"><h1 id="title"></h1></div>

    <div class="menu glass" id="menu" role="dialog" aria-label="Réglages">
      <h3>Vitesse de lecture</h3>
      <div class="chips" id="chips"></div>
      <button class="opt" id="oLoop" role="switch" aria-checked="false"><span>Lecture en boucle</span><span class="sw"><i></i></span></button>
      <button class="opt" id="oFill" role="switch" aria-checked="false"><span>Remplir l'écran</span><span class="sw"><i></i></span></button>
      <button class="opt" id="oAmb" role="switch" aria-checked="true"><span>Ambiance lumineuse</span><span class="sw"><i></i></span></button>
      <button class="opt" id="o3d" role="switch" aria-checked="true"><span>Effet 3D</span><span class="sw"><i></i></span></button>
    </div>

    <div class="bar glass" id="bar">
      <div class="seek" id="seek" tabindex="0" role="slider" aria-label="Position" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="track"><div class="clip"><div class="buf" id="buf"></div><div class="fill" id="fill"></div><div class="comet" id="comet"></div></div><div class="glow" id="glow"></div><div class="knob" id="knob"></div></div>
        <div class="tip glass" id="tip">0:00</div>
      </div>
      <div class="row">
        <button id="play" aria-label="Lecture"></button>
        <button id="back" aria-label="Reculer de 10 secondes"></button>
        <button id="fwd" aria-label="Avancer de 10 secondes"></button>
        <div class="vol"><button id="mute" aria-label="Son"></button><div class="vs" id="vol" tabindex="0" role="slider" aria-label="Volume" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100"><div class="vt"><div class="vf" id="vf"></div><div class="vk" id="vk"></div></div><div class="vp" id="vp">100%</div></div></div>
        <span class="time"><span id="cur">0:00</span><span class="tot"> / <span id="dur">0:00</span></span></span>
        <span class="sp"></span>
        <button id="set" aria-label="Réglages" aria-expanded="false"></button>
        <button id="pip" aria-label="Image dans l'image"></button>
        <button id="fs" aria-label="Plein écran"></button>
      </div>
    </div>

    <div class="pop" id="resume"><div class="card glass" role="dialog" aria-modal="true" aria-labelledby="rt">
      <h2 id="rt">Reprendre la lecture ?</h2><p id="rp"></p>
      <div class="btns"><button id="restart">Depuis le début</button><button class="main" id="cont">Reprendre</button></div>
    </div></div>

    <div class="pop" id="errp"><div class="card glass" role="alertdialog" aria-modal="true" aria-labelledby="et">
      <h2 id="et">Lecture impossible</h2><p>La vidéo est inaccessible ou son format n'est pas pris en charge.</p>
      <div class="btns"><button class="main" id="retry">Réessayer</button></div>
    </div></div>
  </main>
</div>
<footer class="sig" aria-hidden="true"><span class="pw">Powered by</span><span class="sh">Shadow</span></footer>

<script>
(()=>{
"use strict";
/* Verrouillage : clic droit, appui long, sélection, glisser, raccourcis d'inspection */
const nope=e=>{e.preventDefault();e.stopPropagation();return false};
["contextmenu","dragstart","selectstart","copy","cut","beforecopy"].forEach(t=>document.addEventListener(t,nope,true));
document.addEventListener("selectionchange",()=>{const g=getSelection();if(g&&g.rangeCount)g.removeAllRanges()});
document.addEventListener("keydown",e=>{const k=e.key.toLowerCase(),c=e.ctrlKey||e.metaKey;
  if(e.key==="F12"||(c&&["u","s","p"].includes(k))||(c&&e.shiftKey&&["i","j","c","k"].includes(k))||(e.metaKey&&e.altKey&&["i","j","c","u"].includes(k)))nope(e)},true);

/* ═══════════════ CONFIGURATION — modifie ici ═══════════════ */
const CONFIG={
  url:   "https://ia801907.us.archive.org/2/items/reacher-s-04-e-05/Reacher-S04-E05.mp4",
  title: "Reacher · S04 E05",
  autoplay: false,   // le navigateur peut bloquer l'autoplay avec le son
  loop: false,
  ambient: true,     // lueur colorée autour de la vidéo
  tilt3d: true       // effet 3D au survol (PC)
};
/* ═══════════════════════════════════════════════════════════ */

const $=id=>document.getElementById(id);
const I={
play:'<svg viewBox="0 0 24 24"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.4-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>',
pause:'<svg viewBox="0 0 24 24"><rect x="6" y="5" width="4.2" height="14" rx="1.4"/><rect x="13.8" y="5" width="4.2" height="14" rx="1.4"/></svg>',
back:'<svg viewBox="0 0 24 24"><path d="M12 5V2L7 6l5 4V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/><text x="12" y="16.4" font-size="6.5" font-weight="700" text-anchor="middle">10</text></svg>',
fwd:'<svg viewBox="0 0 24 24"><path d="M12 5V2l5 4-5 4V7a6 6 0 1 0 6 6h2a8 8 0 1 1-8-8z"/><text x="12" y="16.4" font-size="6.5" font-weight="700" text-anchor="middle">10</text></svg>',
vol:'<svg viewBox="0 0 24 24"><path d="M4 9.5v5h3.6l4.6 3.8V5.7L7.6 9.5H4zm11.5-1.8a1 1 0 0 0-.9 1.7 3.8 3.8 0 0 1 0 5.2 1 1 0 1 0 1.5 1.3 5.8 5.8 0 0 0 0-7.8 1 1 0 0 0-.6-.4z"/></svg>',
low:'<svg viewBox="0 0 24 24"><path d="M4 9.5v5h3.6l4.6 3.8V5.7L7.6 9.5H4zm11.5 2.5a3 3 0 0 0-1.4-2.5v5a3 3 0 0 0 1.4-2.5z"/></svg>',
mute:'<svg viewBox="0 0 24 24"><path d="M4 9.5v5h3.6l4.6 3.8V5.7L7.6 9.5H4zm12.3.2-1.4 1.4 1.9 1.9-1.9 1.9 1.4 1.4 1.9-1.9 1.9 1.9 1.4-1.4-1.9-1.9 1.9-1.9-1.4-1.4-1.9 1.9-1.9-1.9z"/></svg>',
set:'<svg viewBox="0 0 24 24"><path d="M4 7a1 1 0 0 1 1-1h7.1a3 3 0 0 1 5.8 0H19a1 1 0 1 1 0 2h-1.1a3 3 0 0 1-5.8 0H5a1 1 0 0 1-1-1zm3 10a1 1 0 0 1 1-1h-1.1a3 3 0 0 1 5.8 0H19a1 1 0 1 1 0 2h-5.3a3 3 0 0 1-5.8 0H8a1 1 0 0 1-1-1z" transform="translate(0 0)"/></svg>',
pip:'<svg viewBox="0 0 24 24"><path d="M19 5H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2zm0 12H5V7h14v10zm-1-5h-6v4h6v-4z"/></svg>',
fs:'<svg viewBox="0 0 24 24"><path d="M4 9V4h5v2H6v3H4zm10-5h6v5h-2V6h-4V4zM4 15h2v3h3v2H4v-5zm14 0h2v5h-5v-2h3v-3z"/></svg>',
fsx:'<svg viewBox="0 0 24 24"><path d="M9 4v5H4V7h3V4h2zm6 0h2v3h3v2h-5V4zM4 15h5v5H7v-3H4v-2zm11 0h5v2h-3v3h-2v-5z"/></svg>'};
const v=$("v"),pl=$("pl"),stage=$("stage");
const sv=(k,x)=>{try{localStorage.setItem(k,x)}catch(e){}};
const ld=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const rm=k=>{try{localStorage.removeItem(k)}catch(e){}};
const buzz=p=>{try{navigator.vibrate&&navigator.vibrate(p||8)}catch(e){}};
const fmt=s=>{if(!isFinite(s)||s<0)s=0;s=Math.floor(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),c=s%60;return(h?h+":"+String(m).padStart(2,"0"):m)+":"+String(c).padStart(2,"0")};
const KEY="vp:pos:"+CONFIG.url;
const MOBILE=matchMedia("(pointer:coarse)").matches&&Math.min(screen.width,screen.height)<=900;
let introOn=MOBILE,needResume=false;if(MOBILE)pl.classList.add("intro");

$("title").textContent=CONFIG.title;document.title=CONFIG.title;
$("start").innerHTML=I.play;$("play").innerHTML=I.play;$("back").innerHTML=I.back;$("fwd").innerHTML=I.fwd;$("mute").innerHTML=I.vol;$("set").innerHTML=I.set;$("pip").innerHTML=I.pip;$("fs").innerHTML=I.fs;
if(!document.pictureInPictureEnabled)$("pip").style.display="none";

/* Réglages (mémorisés) */
const pref=(k,d)=>{const x=ld("vp:"+k);return x===null?d:x==="1"};
const S={loop:pref("loop",CONFIG.loop),fill:pref("fill",false),amb:pref("amb",CONFIG.ambient),d3:pref("d3",CONFIG.tilt3d)};
const opts={loop:$("oLoop"),fill:$("oFill"),amb:$("oAmb"),d3:$("o3d")};
function applyS(){v.loop=S.loop;v.style.objectFit=S.fill?"cover":"contain";stage.classList.toggle("off",!S.amb);$("aura").style.opacity=S.amb?"":".15";
  for(const k in opts)opts[k].setAttribute("aria-checked",S[k]);}
for(const k in opts)opts[k].onclick=()=>{S[k]=!S[k];sv(k,S[k]?"1":"0");buzz(8);applyS();if(k==="amb")ambLoop()};
applyS();

const speeds=[.5,.75,1,1.25,1.5,2],chips=$("chips");
speeds.forEach(s=>{const b=document.createElement("button");b.textContent=s+"×";b.onclick=()=>{v.playbackRate=s;buzz(6);[...chips.children].forEach((c,i)=>c.classList.toggle("sel",speeds[i]===s))};if(s===1)b.classList.add("sel");chips.appendChild(b)});
const menu=$("menu");new ResizeObserver(()=>pl.style.setProperty("--bh",$("bar").offsetHeight+"px")).observe($("bar"));menu.querySelectorAll(".chips,.opt").forEach((e,i)=>e.style.setProperty("--i",i));
function menuTo(on){menu.classList.toggle("on",on);$("set").setAttribute("aria-expanded",on);buzz(8);showUI(on)}
$("set").onclick=e=>{e.stopPropagation();menuTo(!menu.classList.contains("on"))};
pl.addEventListener("pointerdown",e=>{if(menu.classList.contains("on")&&!menu.contains(e.target)&&!$("set").contains(e.target))menuTo(false)});

/* Chargement + reprise */
let savedT=0,checked=false;
v.setAttribute("controlslist","nodownload");v.src=CONFIG.url;pl.classList.add("wait");v.volume=isFinite(parseFloat(ld("vp:vol")))?Math.min(1,Math.max(0,parseFloat(ld("vp:vol")))):1;
if("mediaSession"in navigator)navigator.mediaSession.metadata=new MediaMetadata({title:CONFIG.title});
v.addEventListener("loadedmetadata",()=>{
  $("dur").textContent=fmt(v.duration);if(checked)return;checked=true;
  let r=null;try{r=JSON.parse(ld(KEY)||"null")}catch(e){}
  if(r&&r.t>10&&(!isFinite(v.duration)||r.t<v.duration-20)){savedT=r.t;$("rp").textContent="Vous vous étiez arrêté à "+fmt(r.t)+".";if(introOn)needResume=true;else{v.pause();openPop("resume")}}
  else if(CONFIG.autoplay)v.play().catch(()=>{});
});
function openPop(id){const p=$(id);p.classList.add("on");buzz(12);showUI(true);setTimeout(()=>{const b=p.querySelector(".main");b&&b.focus({preventScroll:true})},80)}
const closePop=id=>$(id).classList.remove("on");
$("cont").onclick=()=>{v.currentTime=savedT;closePop("resume");buzz(10);v.play().catch(()=>{})};
$("restart").onclick=()=>{rm(KEY);v.currentTime=0;closePop("resume");buzz(6);v.play().catch(()=>{})};
$("retry").onclick=()=>{closePop("errp");pl.classList.add("wait");v.load()};
v.addEventListener("error",()=>{pl.classList.remove("wait");openPop("errp")});

const toggle=()=>v.paused?v.play().catch(()=>{}):v.pause();
function pulse(i){const p=$("pulse");p.innerHTML=i;p.classList.remove("go");void p.offsetWidth;p.classList.add("go")}
$("play").onclick=()=>{buzz(8);toggle()};
v.addEventListener("play",()=>{$("play").innerHTML=I.pause;$("play").setAttribute("aria-label","Pause");armHide();ambLoop()});
v.addEventListener("pause",()=>{$("play").innerHTML=I.play;$("play").setAttribute("aria-label","Lecture");showUI(true);persist()});
v.addEventListener("waiting",()=>pl.classList.add("wait"));
["canplay","playing","seeked"].forEach(e=>v.addEventListener(e,()=>pl.classList.remove("wait")));
v.addEventListener("ended",()=>{if(!v.loop){rm(KEY);showUI(true)}});
function skip(d){v.currentTime=Math.max(0,Math.min(v.duration||0,v.currentTime+d));buzz(6);const e=$(d<0?"fbl":"fbr");e.textContent=(d<0?"−":"+")+Math.abs(d)+" s";e.classList.remove("go");void e.offsetWidth;e.classList.add("go")}
$("back").onclick=()=>skip(-10);$("fwd").onclick=()=>skip(10);

/* Progression */
let raf=0,drag=false,lastSave=0,cur=0,tgt=0,W=1,anim=0,sking=false;
const comet=$("comet");
function step(){anim=0;const d=tgt-cur;cur=Math.abs(d)<.0003?tgt:cur+d*((drag||sking)?.2:1);
  const x=cur*W,tail=Math.min(260,90+Math.abs(tgt-cur)*W*1.4);
  $("fill").style.transform="scaleX("+cur+")";$("knob").style.left=cur*100+"%";
  $("glow").style.transform="translate3d("+x+"px,0,0)";comet.style.width=tail+"px";comet.style.transform="translate3d("+(x-tail)+"px,0,0)";
  if(cur!==tgt)anim=requestAnimationFrame(step)}
function setT(r){tgt=r;if(!anim)anim=requestAnimationFrame(step)}
new ResizeObserver(()=>{W=$("seek").offsetWidth||1;setT(tgt)}).observe($("seek"));
v.addEventListener("seeking",()=>sking=true);v.addEventListener("seeked",()=>sking=false);
function paint(){raf=0;const d=v.duration||0,t=v.currentTime||0,r=d?t/d:0;
  if(!drag){setT(r);$("seek").setAttribute("aria-valuenow",Math.round(r*100))}
  $("cur").textContent=fmt(t);
  if(v.buffered.length){let e=0;for(let i=0;i<v.buffered.length;i++)if(v.buffered.start(i)<=t+1)e=Math.max(e,v.buffered.end(i));$("buf").style.transform="scaleX("+(d?e/d:0)+")"}}
const sched=()=>{if(!raf)raf=requestAnimationFrame(paint)};
v.addEventListener("timeupdate",()=>{sched();const n=Date.now();if(n-lastSave>2000){lastSave=n;persist()}});
v.addEventListener("progress",sched);v.addEventListener("durationchange",()=>{$("dur").textContent=fmt(v.duration);sched()});
function persist(){if(v.duration&&v.currentTime>5&&v.currentTime<v.duration-20)sv(KEY,JSON.stringify({t:v.currentTime,d:v.duration,ts:Date.now()}))}
addEventListener("pagehide",persist);document.addEventListener("visibilitychange",()=>{if(document.hidden)persist()});

const sk=$("seek");
const ratio=e=>{const b=sk.getBoundingClientRect();return Math.max(0,Math.min(1,(e.clientX-b.left)/b.width))};
function scrub(e){const r=ratio(e);setT(r);$("tip").style.left=r*100+"%";$("tip").textContent=fmt(r*(v.duration||0));return r*(v.duration||0)}
sk.addEventListener("pointerdown",e=>{drag=true;sk.classList.add("drag");sk.setPointerCapture(e.pointerId);scrub(e);buzz(5)});
sk.addEventListener("pointermove",e=>{if(drag)scrub(e);else{const r=ratio(e);$("tip").style.left=r*100+"%";$("tip").textContent=fmt(r*(v.duration||0))}});
sk.addEventListener("pointerup",e=>{if(!drag)return;drag=false;sk.classList.remove("drag");v.currentTime=scrub(e);buzz(8)});
sk.addEventListener("pointercancel",()=>{drag=false;sk.classList.remove("drag");sched()});
sk.addEventListener("keydown",e=>{if(e.key==="ArrowLeft"){skip(-5);e.preventDefault()}if(e.key==="ArrowRight"){skip(5);e.preventDefault()}});

/* Volume, PiP, plein écran */
const vs=$("vol");let vdrag=false;
const vr=e=>{const b=vs.getBoundingClientRect();return Math.max(0,Math.min(1,(e.clientX-b.left)/b.width))};
const setV=q=>{v.volume=Math.max(0,Math.min(1,q));v.muted=v.volume===0};
vs.addEventListener("pointerdown",e=>{vdrag=true;vs.classList.add("drag");vs.setPointerCapture(e.pointerId);setV(vr(e));buzz(5)});
vs.addEventListener("pointermove",e=>{if(vdrag)setV(vr(e))});
const vend=()=>{vdrag=false;vs.classList.remove("drag")};
vs.addEventListener("pointerup",vend);vs.addEventListener("pointercancel",vend);
vs.addEventListener("keydown",e=>{if(e.key==="ArrowLeft"||e.key==="ArrowRight"){e.preventDefault();e.stopPropagation();setV(v.volume+(e.key==="ArrowLeft"?-.05:.05))}});
document.querySelector(".vol").addEventListener("wheel",e=>{e.preventDefault();setV(v.volume-Math.sign(e.deltaY)*.05)},{passive:false});
$("mute").onclick=()=>{v.muted=!v.muted;buzz(6)};
v.addEventListener("volumechange",()=>{$("mute").innerHTML=(v.muted||v.volume===0)?I.mute:(v.volume<.5?I.low:I.vol);const q=v.muted?0:v.volume;$("vf").style.transform="scaleX("+q+")";$("vk").style.left=$("vp").style.left=q*100+"%";$("vp").textContent=Math.round(q*100)+"%";vs.setAttribute("aria-valuenow",Math.round(q*100));sv("vp:vol",String(v.volume))});
$("pip").onclick=async()=>{try{document.pictureInPictureElement?await document.exitPictureInPicture():await v.requestPictureInPicture()}catch(e){}};
const isFull=()=>!!(document.fullscreenElement||document.webkitFullscreenElement)||stage.classList.contains("pseudo");
async function enterFull(){
  let ok=false;
  try{if(stage.requestFullscreen){await stage.requestFullscreen({navigationUI:"hide"});ok=true}else if(stage.webkitRequestFullscreen){stage.webkitRequestFullscreen();ok=true}}catch(e){}
  if(!ok){stage.classList.add("pseudo","fsm");syncFs()}
  try{await screen.orientation.lock("landscape")}catch(e){}
}
function exitFull(){
  try{screen.orientation.unlock()}catch(e){}
  if(stage.classList.contains("pseudo")){stage.classList.remove("pseudo","fsm");syncFs()}
  else{try{(document.exitFullscreen||document.webkitExitFullscreen).call(document)}catch(e){}}
}
const fs=()=>isFull()?exitFull():enterFull();
$("start").onclick=()=>{introOn=false;pl.classList.remove("intro");buzz([10,30,14]);enterFull();if(needResume)openPop("resume");else v.play().catch(()=>{})};
$("fs").onclick=()=>{buzz(8);fs()};
const syncFs=()=>{const f=!!document.fullscreenElement||stage.classList.contains("pseudo");stage.classList.toggle("fsm",f);$("fs").innerHTML=f?I.fsx:I.fs;pl.style.transform="";if(!f){try{screen.orientation.unlock()}catch(e){}}};
document.addEventListener("fullscreenchange",syncFs);document.addEventListener("webkitfullscreenchange",syncFs);

/* Auto-masquage */
let ht=0;
function showUI(keep){pl.classList.remove("hide");clearTimeout(ht);if(!keep)armHide()}
function armHide(){clearTimeout(ht);ht=setTimeout(()=>{if(!v.paused&&!drag&&!menu.classList.contains("on")&&!document.querySelector(".pop.on")&&!$("bar").matches(":hover"))pl.classList.add("hide")},3000)}

/* Reflets liquid glass qui suivent le doigt/curseur + inclinaison 3D */
let tr=0,tx=0,ty=0;
const canTilt=matchMedia("(hover:hover) and (pointer:fine)").matches&&!matchMedia("(prefers-reduced-motion:reduce)").matches;
pl.addEventListener("pointermove",e=>{
  showUI(v.paused);
  const g=e.target.closest&&e.target.closest(".glass");
  if(g){const b=g.getBoundingClientRect();g.style.setProperty("--mx",(e.clientX-b.left)+"px");g.style.setProperty("--my",(e.clientY-b.top)+"px")}
  if(canTilt&&S.d3&&!stage.classList.contains("fsm")){const b=pl.getBoundingClientRect();tx=(e.clientX-b.left)/b.width-.5;ty=(e.clientY-b.top)/b.height-.5;if(!tr)tr=requestAnimationFrame(()=>{tr=0;pl.classList.add("tilt");pl.style.transform="rotateX("+(-ty*5)+"deg) rotateY("+(tx*7)+"deg) scale(1.005)"})}
});
pl.addEventListener("pointerleave",()=>{pl.classList.remove("tilt");pl.style.transform=""});

/* Double-tap / tap */
let tapT=0,lastTap=0;
v.addEventListener("pointerup",e=>{
  if(introOn)return;
  if(e.pointerType==="mouse"&&e.button!==0)return;
  const n=Date.now(),b=v.getBoundingClientRect(),x=(e.clientX-b.left)/b.width;
  if(n-lastTap<300){clearTimeout(tapT);lastTap=0;if(x<.35)skip(-10);else if(x>.65)skip(10);else fs();return}
  lastTap=n;
  tapT=setTimeout(()=>{if(pl.classList.contains("hide")&&e.pointerType==="touch")showUI();else{buzz(8);const w=v.paused;toggle();pulse(w?I.play:I.pause)}},e.pointerType==="touch"?290:250)
});

/* Ambiance : 2 images/s dans un mini canvas flouté */
const cv=$("amb"),cx=cv.getContext("2d");let at=0;
function ambLoop(){clearTimeout(at);if(!S.amb||v.paused||document.hidden)return;try{cx.drawImage(v,0,0,48,27)}catch(e){}at=setTimeout(ambLoop,450)}
v.addEventListener("seeked",()=>{if(S.amb)try{cx.drawImage(v,0,0,48,27)}catch(e){}});
document.addEventListener("visibilitychange",ambLoop);

/* Clavier + écran de verrouillage */
document.addEventListener("keydown",e=>{
  if(document.querySelector(".pop.on"))return;
  const k=e.key.toLowerCase();
  if(k==="escape"&&menu.classList.contains("on")){menuTo(false);return}
  if(k===" "||k==="k"){if(e.target.tagName==="BUTTON"||e.target.tagName==="INPUT")return;e.preventDefault();const w=v.paused;toggle();pulse(w?I.play:I.pause)}
  else if(k==="arrowleft"&&e.target!==sk)skip(-10);else if(k==="arrowright"&&e.target!==sk)skip(10);
  else if(k==="arrowup"){e.preventDefault();v.volume=Math.min(1,v.volume+.1)}else if(k==="arrowdown"){e.preventDefault();v.volume=Math.max(0,v.volume-.1)}
  else if(k==="m")v.muted=!v.muted;else if(k==="f")fs();else if(k==="l"){opts.loop.click()}
  showUI(v.paused)
});
if("mediaSession"in navigator){const m=navigator.mediaSession;m.setActionHandler("play",()=>v.play());m.setActionHandler("pause",()=>v.pause());m.setActionHandler("seekbackward",()=>skip(-10));m.setActionHandler("seekforward",()=>skip(10))}
})();
</script>
</body>
</html>
